<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>munkr funkr status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdfdfc;
  --text:#141413;
  --muted:#8b8a85;
  --line:#e6e5e1;
  --up:#12b981;
  --warn:#e0a007;
  --down:#e5484d;
}
html[data-theme="dark"]{
  --bg:#080807;
  --text:#f4f3f1;
  --muted:#7c7a75;
  --line:#232220;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;padding:64px 24px 96px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}
h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
button{
  font-family:inherit;font-size:12px;color:var(--muted);
  background:none;border:0;padding:0;cursor:pointer;
}
button:hover{color:var(--text)}
button:focus-visible{outline:1px solid var(--muted);outline-offset:3px}
.summary{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:28px}
.summary strong{font-weight:500;font-size:15px}
.summary span{color:var(--muted);font-size:12px}
.monitor{padding:22px 0;border-top:1px solid var(--line)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.row h2{font-size:14px;font-weight:400;margin:0}
.state{font-size:12px;color:var(--muted)}
.track{height:6px;margin-top:14px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:currentColor}
.legend{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--muted)}
.operational{color:var(--up)}
.issues{color:var(--warn)}
.outage{color:var(--down)}
@media(max-width:560px){
  .wrap{padding:44px 20px 64px}
  .bars{height:18px}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>munkr funkr</h1>
    <button id="theme">dark</button>
  </header>

  <div class="summary">
    <strong id="summary">all good</strong>
    <span id="checked"></span>
  </div>

  <div id="monitors"></div>
</div>

<script>
const services = [
  { name: "photon or servers", status: "outage", uptime: "0.1%" },
  { name: "website", status: "operational", uptime: "99.8%" },
  { name: "applab", status: "outage", uptime: "50.4%" }
];

const labels = {
  operational: "operational",
  issues: "experiencing issues",
  outage: "down"
};

const banner = {
  operational: "all good",
  issues: "some issues",
  outage: "alot of issues"
};

const rank = { operational: 0, issues: 1, outage: 2 };
const worst = services.reduce((a, s) => rank[s.status] > rank[a] ? s.status : a, "operational");

document.getElementById("summary").textContent = banner[worst];
document.getElementById("checked").textContent = "last 90 days";

document.getElementById("monitors").innerHTML = services.map(s => {
  const pct = Math.max(0, Math.min(100, parseFloat(s.uptime)));
  const level = pct >= 90 ? "operational" : pct >= 40 ? "issues" : "outage";
  return `
    <section class="monitor ${level}">
      <div class="row">
        <h2>${s.name}</h2>
        <span class="state">${labels[s.status]}</span>
      </div>
      <div class="track"><i style="width:${pct}%"></i></div>
      <div class="legend"><span>90 days ago</span><span>${s.uptime}</span><span>today</span></div>
    </section>`;
}).join("");

const root = document.documentElement;
const toggle = document.getElementById("theme");
toggle.addEventListener("click", () => {
  const dark = root.dataset.theme === "dark";
  root.dataset.theme = dark ? "light" : "dark";
  toggle.textContent = dark ? "dark" : "light";
});
</script>

</body>
</html>

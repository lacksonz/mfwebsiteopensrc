<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>munkr funkr status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --text:#0f1115;
  --muted:#8a909a;
  --line:#e8eaee;
  --chip:#ffffff;
  --up:#12b981;
  --up-soft:#edfbf4;
  --warn:#f0b429;
  --warn-soft:#fff8e9;
  --down:#f4635e;
  --down-soft:#fef0ef;
}
html[data-theme="dark"]{
  --bg:#080807;
  --text:#f4f3f1;
  --muted:#83817c;
  --line:#232220;
  --chip:#131211;
  --up-soft:#0d1512;
  --warn-soft:#161206;
  --down-soft:#170e0d;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:700px;margin:0 auto;padding:0 24px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:38px 0 44px}
h1{font-size:27px;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1}
button{
  font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;
  border:1px solid var(--line);border-radius:3px;
  background:var(--chip);color:var(--text);cursor:pointer;
  transition:border-color .15s ease;
}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--up);outline-offset:2px}
svg{display:block}
.banner{
  display:flex;align-items:center;gap:12px;
  padding:19px 22px;border-radius:4px;color:#fff;font-weight:600;font-size:14.5px;
}
.banner.operational{background:var(--up)}
.banner.issues{background:var(--warn)}
.banner.outage{background:var(--down)}
.monitor{padding:26px 0;margin-top:14px}
.monitor:first-child{margin-top:44px}
#monitors{padding-bottom:44px}
.monitor.operational{background:var(--up-soft)}
.monitor.issues{background:var(--warn-soft)}
.monitor.outage{background:var(--down-soft)}
.monitor .row{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.monitor h2{font-size:17px;font-weight:500;margin:0;letter-spacing:-.01em}
.state{font-size:12.5px;font-weight:600}
.operational .state{color:var(--up)}
.issues .state{color:#d99206}
.outage .state{color:var(--down)}
.bars{display:flex;gap:2px;height:26px;margin-top:14px}
.bars span{flex:1;border-radius:1px;min-width:2px}
.operational .bars span{background:var(--up)}
.issues .bars span{background:var(--warn)}
.outage .bars span{background:var(--down)}
.bars span.dip{opacity:.42}
.legend{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:10.5px;font-weight:500}
.operational .legend{color:var(--up)}
.issues .legend{color:#d99206}
.outage .legend{color:var(--down)}
.legend hr{flex:1;border:0;border-top:1px solid currentColor;opacity:.3;margin:0}
@media(max-width:560px){
  .bars{height:20px}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>munkr funkr</h1>
    <button id="theme" aria-label="switch theme">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="banner" id="banner">
    <span id="banner-text">all systems operational</span>
  </div>
</div>

<div id="monitors"></div>

<script>
const services = [
  { name: "photon or servers", status: "outage", uptime: "99.9%" },
  { name: "website", status: "operational", uptime: "99.8%" },
  { name: "applab", status: "outage", uptime: "99.4%" }
];

const labels = {
  operational: "operational",
  issues: "experiencing issues",
  outage: "down"
};

const banner = {
  operational: "all good",
  issues: "some issues",
  outage: "alot of issues"
};

const rank = { operational: 0, issues: 1, outage: 2 };
const worst = services.reduce((a, s) => rank[s.status] > rank[a] ? s.status : a, "operational");

document.getElementById("banner").classList.add(worst);
document.getElementById("banner-text").textContent = banner[worst];

document.getElementById("monitors").innerHTML = services.map(s => {
  const bars = Array.from({ length: 74 }, (_, i) => {
    const dip = s.status !== "operational" && (i % 11 === 3 || i % 17 === 6);
    return `<span class="${dip ? "dip" : ""}"></span>`;
  }).join("");
  return `
    <section class="monitor ${s.status}">
      <div class="wrap">
        <div class="row">
          <h2>${s.name}</h2>
          <span class="state">${labels[s.status]}</span>
        </div>
        <div class="bars">${bars}</div>
        <div class="legend"><span>90 days ago</span><hr><span>${s.uptime}</span><hr><span>today</span></div>
      </div>
    </section>`;
}).join("");

const root = document.documentElement;
if (window.matchMedia("(prefers-color-scheme: dark)").matches) root.dataset.theme = "dark";
document.getElementById("theme").addEventListener("click", () => {
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
});
</script>

</body>
</html>

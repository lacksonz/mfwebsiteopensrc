<style>
:root{
  --black:#000000;
  --line:#242424;
  --line-bright:#ffffff;
  --bone:#f3f1eb;
  --dim:#948f89;
  --red:#b5231f;
  --red-bright:#d1302b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--black);
  color:var(--bone);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow-x:hidden;
}
::selection{background:var(--red);color:var(--bone);}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}
#loader-bg{
  position:fixed;
  inset:0;
  background:#000000;
  z-index:9998;
}
#loader-mark{
  position:fixed;
  top:50%;
  left:50%;
  width:400px;
  height:auto;
  z-index:9999;
  transform:translate(-50%,-50%) scale(0.3) rotate(-35deg);
  opacity:0;
  animation:logo-grow 1.2s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes logo-grow{
  0%{transform:translate(-50%,-50%) scale(0.3) rotate(-35deg);opacity:0;}
  100%{transform:translate(-50%,-50%) scale(1) rotate(0deg);opacity:1;}
}
main{
  opacity:0;
  transition:opacity 0.6s ease;
}
main.reveal{
  opacity:1;
}
.wrap{
  max-width:1280px;
  margin:0 auto;
  padding:0 32px;
}
header{
  background:var(--black);
  border-bottom:1px solid var(--line);
  padding:14px 0;
}
nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
}
.header-logo{
  height:56px;
  width:auto;
}
.nav-right{
  display:flex;
  align-items:center;
  gap:14px;
}
.btn-secondary{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:12px 24px;
  border-radius:4px;
  border:1px solid var(--line-bright);
  background:transparent;
  color:var(--bone);
  font-weight:700;
  font-size:0.82rem;
  text-transform:uppercase;
  letter-spacing:0.03em;
  transition:background 0.2s ease;
}
.btn-secondary:hover{
  background:rgba(255,255,255,0.08);
}
.btn-primary{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:12px 24px;
  border-radius:4px;
  background:var(--red);
  color:var(--bone);
  font-weight:700;
  font-size:0.82rem;
  text-transform:uppercase;
  letter-spacing:0.03em;
  transition:background 0.2s ease;
}
.btn-primary:hover{
  background:var(--red-bright);
}
.hero{
  position:relative;
  min-height:calc(100vh - 63px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}
.hero-bg{
  position:absolute;
  inset:0;
  z-index:0;
}
.hero-bg img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.hero-bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
}
.hero-inner{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  max-width:680px;
  padding:60px 24px;
}
.eyebrow{
  font-size:0.78rem;
  font-weight:700;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:var(--red-bright);
}
.hero-logo{
  width:100%;
  max-width:540px;
  height:auto;
}
.hero p{
  color:var(--bone);
  font-weight:400;
  font-size:1.1rem;
  line-height:1.6;
  max-width:480px;
}
.hero .btn-primary{
  padding:16px 34px;
  font-size:0.95rem;
  font-weight:800;
}
footer{
  border-top:1px solid var(--line);
  padding:28px 0;
}
.footer-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:16px;
  color:var(--dim);
  font-size:0.78rem;
}
</style>

<script>
window.addEventListener("load", function(){
  var bg = document.getElementById("loader-bg");
  var mark = document.getElementById("loader-mark");
  var target = document.querySelector(".header-logo");
  var main = document.querySelector("main");

  setTimeout(function(){
    var markRect = mark.getBoundingClientRect();
    var targetRect = target.getBoundingClientRect();

    var markCenterX = markRect.left + markRect.width / 2;
    var markCenterY = markRect.top + markRect.height / 2;
    var targetCenterX = targetRect.left + targetRect.width / 2;
    var targetCenterY = targetRect.top + targetRect.height / 2;

    var dx = targetCenterX - markCenterX;
    var dy = targetCenterY - markCenterY;
    var scale = targetRect.width / markRect.width;

    mark.style.animation = "none";
    mark.style.transition = "transform 0.85s cubic-bezier(0.65,0,0.35,1)";
    mark.style.transform = "translate(-50%,-50%) translate(" + dx + "px," + dy + "px) scale(" + scale + ")";

    bg.style.transition = "opacity 0.6s ease";
    bg.style.opacity = "0";
    bg.style.pointerEvents = "none";

    main.classList.add("reveal");

    setTimeout(function(){
      mark.style.transition = "opacity 0.2s ease";
      mark.style.opacity = "0";
    }, 780);

    setTimeout(function(){
      bg.style.display = "none";
      mark.style.display = "none";
    }, 1050);
  }, 1300);
});
</script>

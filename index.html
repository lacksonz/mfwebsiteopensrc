<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>munkr funkr — a horror vr experience</title>
<meta name="description" content="munkr funkr is a room-scale horror vr game, out now on meta quest.">
<style>
:root{
  --black:#000000;
  --line:#242424;
  --line-bright:#ffffff;
  --bone:#f3f1eb;
  --dim:#948f89;
  --red:#b5231f;
  --red-bright:#d1302b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--black);
  color:var(--bone);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow-x:hidden;
}
::selection{background:var(--red);color:var(--bone);}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}
#loader{
  position:fixed;
  inset:0;
  background:#000000;
  z-index:10000;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity 0.7s ease;
}
#loader.done{
  opacity:0;
  pointer-events:none;
}
.loader-mark{
  width:96px;
  height:96px;
  object-fit:contain;
  transform:scale(0.35);
  opacity:0;
  animation:logo-grow 1.1s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes logo-grow{
  0%{transform:scale(0.35);opacity:0;}
  100%{transform:scale(1);opacity:1;}
}
main{
  opacity:0;
  transition:opacity 0.6s ease;
}
main.reveal{
  opacity:1;
}
.wrap{
  max-width:1280px;
  margin:0 auto;
  padding:0 32px;
}
header{
  background:var(--black);
  border-bottom:1px solid var(--line);
  padding:14px 0;
}
nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
}
.header-logo{
  height:36px;
  width:auto;
}
.nav-right{
  display:flex;
  align-items:center;
  gap:14px;
}
.btn-secondary{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:12px 24px;
  border-radius:4px;
  border:1px solid var(--line-bright);
  background:transparent;
  color:var(--bone);
  font-weight:700;
  font-size:0.82rem;
  text-transform:uppercase;
  letter-spacing:0.03em;
  transition:background 0.2s ease;
}
.btn-secondary:hover{
  background:rgba(255,255,255,0.08);
}
.btn-primary{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:12px 24px;
  border-radius:4px;
  background:var(--red);
  color:var(--bone);
  font-weight:700;
  font-size:0.82rem;
  text-transform:uppercase;
  letter-spacing:0.03em;
  transition:background 0.2s ease;
}
.btn-primary:hover{
  background:var(--red-bright);
}
.hero{
  position:relative;
  min-height:calc(100vh - 63px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}
.hero-bg{
  position:absolute;
  inset:0;
  z-index:0;
}
.hero-bg img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.hero-bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
}
.hero-inner{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
  max-width:680px;
  padding:60px 24px;
}
.eyebrow{
  font-size:0.78rem;
  font-weight:700;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:var(--red-bright);
}
.hero-logo{
  width:100%;
  max-width:540px;
  height:auto;
}
.hero p{
  color:var(--bone);
  font-weight:400;
  font-size:1.1rem;
  line-height:1.6;
  max-width:480px;
}
.hero .btn-primary{
  padding:16px 34px;
  font-size:0.95rem;
  font-weight:800;
  margin-top:6px;
}
footer{
  border-top:1px solid var(--line);
  padding:28px 0;
}
.footer-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:16px;
  color:var(--dim);
  font-size:0.78rem;
}
</style>
</head>
<body>
<div id="loader">
  <img class="loader-mark" src="images/logo.png" alt="munkr funkr logo">
</div>

<header>
  <div class="wrap">
    <nav>
      <a href="https://discord.gg/NQ9u4eM6sA"><img class="header-logo" src="images/logo.png" alt="munkr funkr"></a>
      <div class="nav-right">
        <a href="https://discord.gg/NQ9u4eM6sA" class="btn-secondary">join discord</a>
        <a href="https://www.meta.com/en-gb/experiences/munkr-funkr/1140708545801463/" class="btn-primary">get on vr</a>
      </div>
    </nav>
  </div>
</header>
<main>
  <section class="hero">
    <div class="hero-bg">
      <img src="images/bg.png" alt="">
    </div>
    <div class="hero-inner">
      <span class="eyebrow"></span>
      <img class="hero-logo" src="images/logo.png" alt="munkr funkr">
      <p></p>
      <a href="https://www.meta.com/en-gb/experiences/munkr-funkr/1140708545801463/" class="btn-primary">get on meta</a>
    </div>
  </section>
</main>
<footer>
  <div class="wrap">
    <div class="footer-row">
      <span>yo.................</span>
      <span>why bro reading this</span>
    </div>
  </div>
</footer>
<script>
window.addEventListener("load", function(){
  var loader = document.getElementById("loader");
  var main = document.querySelector("main");
  setTimeout(function(){
    loader.classList.add("done");
    main.classList.add("reveal");
  }, 1300);
});
</script>
</body>
</html>

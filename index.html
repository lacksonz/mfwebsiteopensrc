<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>munkr funkrson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
  }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: #050403;
  }
  .notice {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 13px 20px;
    background: linear-gradient(180deg, #1c1409 0%, #140f07 100%);
    border-bottom: 1px solid rgba(255, 186, 61, 0.28);
    color: #f2e6d2;
    font-size: 14px;
    line-height: 1.4;
    text-align: center;
    transform: translateY(-100%);
    animation: drop 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.15s;
  }
  .notice-text {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .notice svg {
    flex: none;
    width: 18px;
    height: 18px;
    color: #ffba3d;
    animation: pulse 2.2s ease-in-out infinite;
  }
  .discord-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: #5865f2;
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
    border-radius: 6px;
    transition: transform 0.25s ease, background 0.25s ease;
  }
  .discord-btn:hover,
  .discord-btn:focus-visible {
    transform: translateY(-2px);
    background: #4752c4;
  }
  .discord-btn svg {
    width: 16px;
    height: 16px;
    color: #ffffff;
    animation: none;
  }
  .hero {
    position: relative;
    min-height: 100svh;
    background-image: url("images/hero-bg.png");
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    text-align: center;
    padding-bottom: 13vh;
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(to bottom, transparent 55%, rgba(5,4,3,0.75) 100%);
    pointer-events: none;
  }
  .tag {
    position: relative;
    z-index: 2;
    color: #c9c2b8;
    font-size: 14px;
    letter-spacing: 0.5px;
    margin-bottom: 22px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.9s ease forwards 0.3s;
  }
  .quest-btn {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    padding: 15px 30px;
    background: #3a3733;
    color: #8d8781;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    border-radius: 8px;
    box-shadow: none;
    border: none;
    font-family: inherit;
    cursor: not-allowed;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.9s ease forwards 0.55s;
  }
  @keyframes drop {
    to {
      transform: translateY(0);
    }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @keyframes rise {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @media (max-width: 620px) {
    .notice {
      font-size: 13px;
      gap: 10px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .notice, .notice svg, .tag, .quest-btn {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }
</style>
</head>
<body>
<div class="notice" role="alert">
  <span class="notice-text">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    the game has been taken off applab / meta, we are trying to resolve this. join the discord for more info
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
  </span>
  <a class="discord-btn" href="https://discord.gg/FTHYFNz77t">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
      <path d="M20.32 4.57A19.79 19.79 0 0 0 15.43 3l-.24.45a13.6 13.6 0 0 1 4.06 2.1 17.9 17.9 0 0 0-14.5 0 13.6 13.6 0 0 1 4.06-2.1L8.57 3a19.79 19.79 0 0 0-4.89 1.57C.6 9.16-.24 13.63.18 18.04a19.93 19.93 0 0 0 6.04 3.04l1.22-1.7a12.9 12.9 0 0 1-2.05-.99l.5-.39a14.22 14.22 0 0 0 12.22 0l.5.39c-.65.39-1.34.72-2.05.99l1.22 1.7a19.93 19.93 0 0 0 6.04-3.04c.5-5.1-.85-9.53-3.5-13.47zM8.02 15.33c-1.18 0-2.15-1.09-2.15-2.43s.95-2.44 2.15-2.44 2.17 1.1 2.15 2.44c0 1.34-.95 2.43-2.15 2.43zm7.96 0c-1.18 0-2.15-1.09-2.15-2.43s.95-2.44 2.15-2.44 2.16 1.1 2.14 2.44c0 1.34-.94 2.43-2.14 2.43z"/>
    </svg>
    join discord
  </a>
</div>
<div class="hero">
  <p class="tag">get it for free yo</p>
  <button class="quest-btn" type="button" disabled>
    coming soon
  </button>
</div>
</body>
</html>
